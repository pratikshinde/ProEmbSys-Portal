services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propcb_app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-propcb}:${POSTGRES_PASSWORD:-propcb_prod_password}@db:5432/${POSTGRES_DB:-propcb}?schema=public
      - UPLOADS_DIR=/app/uploads
      - NODE_OPTIONS=--max-old-space-size=1536
      - AUTH_TRUST_HOST=true
    volumes:
      - propcb_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: propcb_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propcb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propcb_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-propcb}
    volumes:
      - propcb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propcb} -d ${POSTGRES_DB:-propcb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  propcb_pgdata:
    name: propcb_pgdata
  propcb_uploads:
    name: propcb_uploads
